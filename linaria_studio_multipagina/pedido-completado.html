<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pedido — Flora Studio</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Monsieur+La+Doulaise&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="cart.css">
  <script src="flora-config.js" defer></script>
  <script src="success.js" defer></script>
  <style>
    .success-wrap{min-height:65vh;display:grid;place-items:center;padding:35px 18px;background:var(--cream,#fffdf5)}
    .success-card{width:min(560px,100%);padding:35px 25px;text-align:center;background:#f7f5e9;border:1px solid #dfe4d0}
    .success-flower{font-size:48px;color:var(--sage,#8eaa4d)}
    .success-card h1{font-family:var(--serif);color:var(--ink,#34452a)}
    .success-card p{color:var(--muted,#777b68);font-size:13px;line-height:1.8}
  </style>
</head>
<body>
  <main class="success-wrap">
    <section class="success-card">
      <div class="success-flower" aria-hidden="true">✿</div>
      <p class="eyebrow">FLORA STUDIO</p>
      <h1>¡Gracias por tu pedido!</h1>
      <p data-payment-status aria-live="polite">Estamos comprobando el estado del pago…</p>
      <a class="button" href="index.html">Volver a Flora Studio</a>
    </section>
  </main>
</body>
</html>
